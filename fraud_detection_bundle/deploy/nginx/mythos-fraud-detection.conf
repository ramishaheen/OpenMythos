# nginx reverse proxy for the fraud-detection web service.
# Drop this in /etc/nginx/sites-available/ and symlink to sites-enabled/.

upstream fraud_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name console.mythosbank.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name console.mythosbank.example.com;

    ssl_certificate     /etc/letsencrypt/live/console.mythosbank.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/console.mythosbank.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Hardening headers.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Body cap matches FRAUD_MAX_BODY_MB on the backend.
    client_max_body_size 50m;
    client_body_timeout 120s;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    # Static assets — let the app serve them; nginx adds caching.
    location /static/ {
        proxy_pass http://fraud_backend;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://fraud_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tight rate limit on the analyze endpoint (uncomment after defining
        # `limit_req_zone` in nginx.conf).
        # limit_req zone=analyze burst=10 nodelay;
    }
}
