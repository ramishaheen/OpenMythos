# Fly.io deployment manifest.
#
# Bootstrap:
#   fly launch --no-deploy --copy-config --name mythos-fraud-detection
#   # Choose ONE of these (or both — UI lets the user pick a provider)
#   fly secrets set ANTHROPIC_API_KEY=sk-ant-...
#   fly secrets set DEEPSEEK_API_KEY=sk-...
#   fly secrets set FRAUD_AUTH_TOKEN=$(openssl rand -hex 32)
#   fly volumes create fraud_reports --size 1
#   fly deploy

app = "mythos-fraud-detection"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  FRAUD_MAX_BODY_MB = "50"
  FRAUD_LOG_LEVEL = "INFO"
  FRAUD_REPORT_DIR = "/var/lib/fraud_reports"

[mounts]
  source = "fraud_reports"
  destination = "/var/lib/fraud_reports"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "4s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
